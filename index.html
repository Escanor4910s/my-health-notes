<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ObsMed — Application de rédaction d'observations médicales structurées pour cliniciens. Saisie, analyse IA, export PDF/Word et synchronisation cloud." />
    <meta name="theme-color" content="#9b7a5a" />
    <meta property="og:title" content="ObsMed — Observation médicale structurée" />
    <meta property="og:description" content="Application de rédaction d'observations médicales structurées pour cliniciens. Saisie, analyse IA, export PDF/Word et synchronisation cloud." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>ObsMed — Observation médicale structurée</title>
    <!-- Anti-FOUC: Apply theme IMMEDIATELY before React renders (prevents brown flash) -->
    <script>
      (function() {
        try {
          var accent = localStorage.getItem('obsmed-accenttheme') || 'crimson';
          var bg = localStorage.getItem('obsmed-bgtheme') || 'frost';
          var dark = localStorage.getItem('obsmed-dark') === 'true';
          var el = document.documentElement;
          el.setAttribute('data-accent-theme', accent);
          el.setAttribute('data-bg-theme', bg);
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
